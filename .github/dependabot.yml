# Dependabot configuration
# Docs: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Noise-reduction strategy:
#   * MINOR + PATCH updates are bundled per ecosystem, except MapLibre.
#   * npm MAJOR bumps stay ungrouped so each lands in its own PR for review
#     (they can carry breaking changes).
#   * GitHub Actions are pinned to immutable release SHAs; Dependabot updates
#     the pins while inline comments preserve their human-readable versions.
#   * Checks run quarterly: the site is an archive now. Security updates are
#     unaffected and still arrive immediately.
version: 2

updates:
  # JavaScript/TypeScript dependencies
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'quarterly'
      time: '06:00'
      timezone: 'Europe/Berlin'
    open-pull-requests-limit: 10
    labels:
      - 'dependencies'
      - 'javascript'
    commit-message:
      prefix: 'chore'
      prefix-development: 'chore'
      include: 'scope'
    # typescript-eslint 8 currently supports TypeScript <6.1. Avoid a known-red
    # TypeScript 7 PR until that peer range is widened upstream.
    ignore:
      - dependency-name: 'typescript'
        versions: ['7.x']
      # The repo pins Node 24 (.nvmrc, engines), so @types/node must stay on
      # that major; a newer one would type APIs the runtime does not have.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      # Renderer updates need their own bundle-budget review. They must not
      # hold up unrelated fixes when upstream adds substantial bundle weight.
      maplibre:
        patterns:
          - 'maplibre-gl'
        update-types:
          - 'minor'
          - 'patch'
      # Other low-risk updates in one PR; major bumps come separately.
      npm-minor-and-patch:
        patterns:
          - '*'
        exclude-patterns:
          - 'maplibre-gl'
        update-types:
          - 'minor'
          - 'patch'

  # GitHub Actions used in workflows
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'quarterly'
      time: '06:00'
      timezone: 'Europe/Berlin'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'github-actions'
    commit-message:
      prefix: 'chore'
      include: 'scope'
    groups:
      github-actions:
        patterns:
          - '*'
